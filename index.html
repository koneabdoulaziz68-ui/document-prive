<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Document privé</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    /* ==============================
       PAGE DE CONNEXION
       ============================== */

    #loginContainer {

      min-height: 100vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

    }

    .loginBox {

      width: 100%;

      max-width: 430px;

      background: white;

      padding: 35px 25px;

      border-radius: 18px;

      box-shadow:
        0 10px 35px rgba(0,0,0,0.10);

      text-align: center;

    }

    .documentIcon {

      font-size: 50px;

      margin-bottom: 10px;

    }

    .loginBox h1 {

      margin: 0 0 12px;

      font-size: 27px;

    }

    .description {

      color: #666;

      line-height: 1.5;

      margin-bottom: 25px;

    }

    #accessCode {

      width: 100%;

      padding: 16px;

      border: 1px solid #ddd;

      border-radius: 12px;

      font-size: 17px;

      text-align: center;

      outline: none;

      margin-bottom: 15px;

    }

    #accessCode:focus {

      border-color: #111;

    }

    #openButton {

      width: 100%;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #111;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    #openButton:disabled {

      opacity: 0.6;

    }

    #message {

      min-height: 25px;

      margin-top: 15px;

      font-size: 14px;

      line-height: 1.5;

    }

    .success {

      color: #16803c;

    }

    .error {

      color: #d62828;

    }

    /* ==============================
       DOCUMENT
       ============================== */

    #documentContainer {

      display: none;

      min-height: 100vh;

      background: #e9e9e9;

    }

    .documentHeader {

      height: 62px;

      background: #111;

      color: white;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 14px;

      position: sticky;

      top: 0;

      z-index: 1000;

    }

    .documentTitle {

      font-size: 15px;

      font-weight: bold;

    }

    #exitButton {

      width: auto;

      padding: 10px 16px;

      border: none;

      border-radius: 9px;

      background: #d62828;

      color: white;

      font-size: 13px;

      font-weight: bold;

    }

    #loadingDocument {

      padding: 35px 20px;

      text-align: center;

      color: #555;

    }

    #pdfViewer {

      width: 100%;

      padding: 10px 4px 40px;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 12px;

    }

    .pdfPage {

      width: fit-content;

      max-width: 100%;

      background: white;

      box-shadow:
        0 2px 12px rgba(0,0,0,0.18);

      overflow: hidden;

    }

    .pdfPage canvas {

      display: block;

      max-width: 100%;

      height: auto;

    }

    .pageNumber {

      background: #111;

      color: white;

      text-align: center;

      font-size: 11px;

      padding: 5px;

    }

    .pageLoading {

      width: min(100%, 900px);

      height: 250px;

      display: flex;

      align-items: center;

      justify-content: center;

      background: white;

      color: #777;

    }

    @media (max-width: 600px) {

      .loginBox {

        padding: 30px 20px;

      }

      .documentTitle {

        font-size: 12px;

      }

      #exitButton {

        padding: 9px 13px;

        font-size: 12px;

      }

      #pdfViewer {

        padding: 5px 2px 30px;

      }

    }

    @media print {

      body {

        display: none !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       CONNEXION
       ===================================== -->

  <div id="loginContainer">

    <div class="loginBox">

      <div class="documentIcon">
        📄
      </div>

      <h1>
        DOCUMENT PRIVÉ
      </h1>

      <div class="description">
        Entrez votre code d'accès
        pour ouvrir le document.
      </div>

      <input
        id="accessCode"
        type="text"
        placeholder="ABC-123456"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >

      <button
        id="openButton"
        type="button"
      >
        OUVRIR LE DOCUMENT
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- =====================================
       DOCUMENT
       ===================================== -->

  <div id="documentContainer">

    <div class="documentHeader">

      <div class="documentTitle">
        📄 DOCUMENT PRIVÉ
      </div>

      <button
        id="exitButton"
        type="button"
      >
        QUITTER
      </button>

    </div>

    <div id="loadingDocument">
      Chargement du document...
    </div>

    <div id="pdfViewer"></div>

  </div>


  <!-- =====================================
       PDF.JS 2.16.105
       ===================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js">
  </script>


  <script>

    /*
     * Aucun worker PDF.js n'est utilisé.
     * Cela évite les problèmes de compatibilité
     * rencontrés avec certaines versions récentes.
     */

    if (
      typeof pdfjsLib !== "undefined"
    ) {

      pdfjsLib.GlobalWorkerOptions.disableWorker =
        true;

    }


    /* =====================================
       URLS SUPABASE
       ===================================== */

    const VERIFY_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/verify-access";

    const RELEASE_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/release-access";

    const DOCUMENT_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/get-document";


    /* =====================================
       VARIABLES
       ===================================== */

    let currentSessionId = null;

    let pdfDocument = null;

    let pageObserver = null;

    let isClosing = false;


    /* =====================================
       ELEMENTS
       ===================================== */

    const loginContainer =
      document.getElementById(
        "loginContainer"
      );

    const documentContainer =
      document.getElementById(
        "documentContainer"
      );

    const accessCode =
      document.getElementById(
        "accessCode"
      );

    const openButton =
      document.getElementById(
        "openButton"
      );

    const exitButton =
      document.getElementById(
        "exitButton"
      );

    const message =
      document.getElementById(
        "message"
      );

    const pdfViewer =
      document.getElementById(
        "pdfViewer"
      );

    const loadingDocument =
      document.getElementById(
        "loadingDocument"
      );


    /* =====================================
       MESSAGE
       ===================================== */

    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text || "";

      message.className =
        type || "";

    }


    /* =====================================
       OUVERTURE
       ===================================== */

    openButton.addEventListener(
      "click",
      openDocument
    );


    accessCode.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          openDocument();

        }

      }
    );


    async function openDocument() {

      const code =
        accessCode.value.trim();


      if (!code) {

        showMessage(
          "Veuillez entrer votre code d'accès.",
          "error"
        );

        return;

      }


      if (
        typeof pdfjsLib === "undefined"
      ) {

        showMessage(
          "Le lecteur PDF n'a pas pu être chargé.",
          "error"
        );

        return;

      }


      openButton.disabled =
        true;

      openButton.textContent =
        "VÉRIFICATION...";

      showMessage(
        "",
        ""
      );


      try {


        /* =================================
           1. VÉRIFIER LE CODE
           ================================= */

        const verifyResponse =
          await fetch(
            VERIFY_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  code: code
                })

            }
          );


        let verifyResult;


        try {

          verifyResult =
            await verifyResponse.json();

        } catch (error) {

          throw new Error(
            "Réponse invalide du serveur."
          );

        }


        if (
          !verifyResponse.ok ||
          !verifyResult.success
        ) {

          showMessage(
            verifyResult.message ||
            "Accès refusé.",
            "error"
          );

          openButton.disabled =
            false;

          openButton.textContent =
            "OUVRIR LE DOCUMENT";

          return;

        }


        /* =================================
           2. SESSION
           ================================= */

        currentSessionId =
          verifyResult.session_id;


        if (!currentSessionId) {

          throw new Error(
            "Identifiant de session manquant."
          );

        }


        showMessage(
          "Accès autorisé. Chargement du document...",
          "success"
        );


        /* =================================
           3. RÉCUPÉRER LE PDF
           ================================= */

        await loadPdf();


      } catch (error) {

        console.error(
          "Erreur :",
          error
        );


        if (currentSessionId) {

          await releaseSession(
            currentSessionId
          );

          currentSessionId =
            null;

        }


        showMessage(
          error.message ||
          "Une erreur est survenue.",
          "error"
        );


        openButton.disabled =
          false;

        openButton.textContent =
          "RÉESSAYER";

      }

    }


    /* =====================================
       RÉCUPÉRATION DU PDF
       ===================================== */

    async function loadPdf() {

      loadingDocument.style.display =
        "block";

      loadingDocument.textContent =
        "Téléchargement sécurisé du document...";

      pdfViewer.innerHTML =
        "";


      let response;


      try {

        response =
          await fetch(
            DOCUMENT_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  session_id:
                    currentSessionId
                })

            }
          );

      } catch (error) {

        throw new Error(
          "Impossible de contacter le serveur du document."
        );

      }


      /* =================================
         ERREUR SERVEUR
         ================================= */

      if (!response.ok) {

        let errorMessage =
          "Impossible de récupérer le document.";


        try {

          const errorData =
            await response.json();


          if (
            errorData &&
            errorData.message
          ) {

            errorMessage =
              errorData.message;

          }

        } catch (_) {}


        throw new Error(
          errorMessage
        );

      }


      /* =================================
         VÉRIFIER PDF
         ================================= */

      const contentType =
        response.headers.get(
          "content-type"
        );


      if (
        !contentType ||
        contentType
          .toLowerCase()
          .indexOf(
            "application/pdf"
          ) === -1
      ) {

        throw new Error(
          "Le serveur n'a pas renvoyé un PDF."
        );

      }


      loadingDocument.textContent =
        "Préparation du document...";


      const pdfBlob =
        await response.blob();


      const arrayBuffer =
        await pdfBlob.arrayBuffer();


      /* =================================
         PDF.JS
         ================================= */

      loadingDocument.textContent =
        "Ouverture du document...";


      const loadingTask =
        pdfjsLib.getDocument({
          data:
            new Uint8Array(
              arrayBuffer
            ),
          disableWorker:
            true
        });


      pdfDocument =
        await loadingTask.promise;


      if (
        !pdfDocument ||
        pdfDocument.numPages < 1
      ) {

        throw new Error(
          "Le PDF ne contient aucune page."
        );

      }


      /* =================================
         AFFICHAGE
         ================================= */

      loginContainer.style.display =
        "none";

      documentContainer.style.display =
        "block";

      loadingDocument.style.display =
        "none";


      createPages();


      startObserver();


      /*
       * Première page immédiatement.
       */

      const firstPage =
        pdfViewer.querySelector(
          '[data-page="1"]'
        );


      if (firstPage) {

        await renderPage(
          firstPage
        );

      }

    }


    /* =====================================
       CRÉER LES PAGES
       ===================================== */

    function createPages() {

      pdfViewer.innerHTML =
        "";


      for (
        let i = 1;
        i <= pdfDocument.numPages;
        i++
      ) {

        const page =
          document.createElement(
            "div"
          );


        page.className =
          "pdfPage";


        page.dataset.page =
          String(i);


        const loading =
          document.createElement(
            "div"
          );


        loading.className =
          "pageLoading";


        loading.textContent =
          "Page " +
          i +
          " — chargement...";


        page.appendChild(
          loading
        );


        pdfViewer.appendChild(
          page
        );

      }

    }


    /* =====================================
       OBSERVER
       ===================================== */

    function startObserver() {


      if (pageObserver) {

        pageObserver.disconnect();

      }


      pageObserver =
        new IntersectionObserver(
          async function(entries) {

            for (
              const entry of entries
            ) {

              if (
                !entry.isIntersecting
              ) {

                continue;

              }


              const element =
                entry.target;


              if (
                element.dataset.rendered ===
                "true"
              ) {

                continue;

              }


              try {

                await renderPage(
                  element
                );

              } catch (error) {

                console.error(
                  "Erreur page :",
                  error
                );


                element.innerHTML =
                  '<div class="pageLoading">Impossible d’afficher cette page.</div>';

              }

            }

          },
          {
            rootMargin:
              "600px 0px 600px 0px",

            threshold:
              0.01
          }
        );


      const pages =
        pdfViewer.querySelectorAll(
          ".pdfPage"
        );


      pages.forEach(
        function(page) {

          pageObserver.observe(
            page
          );

        }
      );

    }


    /* =====================================
       RENDRE UNE PAGE
       ===================================== */

    async function renderPage(
      element
    ) {


      if (
        element.dataset.rendered ===
        "true"
      ) {

        return;

      }


      const pageNumber =
        Number(
          element.dataset.page
        );


      const page =
        await pdfDocument.getPage(
          pageNumber
        );


      const originalViewport =
        page.getViewport({
          scale: 1
        });


      const screenWidth =
        window.innerWidth;


      const maximumWidth =
        Math.min(
          screenWidth - 10,
          900
        );


      let scale =
        maximumWidth /
        originalViewport.width;


      if (scale < 0.75) {

        scale = 0.75;

      }


      if (scale > 1.5) {

        scale = 1.5;

      }


      const viewport =
        page.getViewport({
          scale: scale
        });


      const canvas =
        document.createElement(
          "canvas"
        );


      const context =
        canvas.getContext(
          "2d"
        );


      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      canvas.width =
        Math.floor(
          viewport.width *
          pixelRatio
        );


      canvas.height =
        Math.floor(
          viewport.height *
          pixelRatio
        );


      canvas.style.width =
        Math.floor(
          viewport.width
        ) + "px";


      canvas.style.height =
        Math.floor(
          viewport.height
        ) + "px";


      element.innerHTML =
        "";


      element.appendChild(
        canvas
      );


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "pageNumber";


      label.textContent =
        "Page " +
        pageNumber +
        " / " +
        pdfDocument.numPages;


      element.appendChild(
        label
      );


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport,

        transform:
          pixelRatio !== 1
            ? [
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
              ]
            : null

      }).promise;


      element.dataset.rendered =
        "true";

    }


    /* =====================================
       LIBÉRER LA SESSION
       ===================================== */

    async function releaseSession(
      sessionId
    ) {

      if (!sessionId) {

        return;

      }


      try {

        await fetch(
          RELEASE_URL,
          {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                session_id:
                  sessionId
              })

          }
        );

      } catch (error) {

        console.error(
          "Erreur libération :",
          error
        );

      }

    }


    /* =====================================
       QUITTER
       ===================================== */

    exitButton.addEventListener(
      "click",
      async function() {


        if (isClosing) {

          return;

        }


        isClosing =
          true;


        const session =
          currentSessionId;


        currentSessionId =
          null;


        await releaseSession(
          session
        );


        if (pageObserver) {

          pageObserver.disconnect();

          pageObserver =
            null;

        }


        pdfDocument =
          null;


        pdfViewer.innerHTML =
          "";


        documentContainer.style.display =
          "none";


        loginContainer.style.display =
          "flex";


        accessCode.value =
          "";


        showMessage(
          "",
          ""
        );


        openButton.disabled =
          false;


        openButton.textContent =
          "OUVRIR LE DOCUMENT";


        isClosing =
          false;

      }
    );


    /* =====================================
       COPIER / COUPER
       ===================================== */

    document.addEventListener(
      "copy",
      function(event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "cut",
      function(event) {

        event.preventDefault();

      }
    );


    /* =====================================
       MENU CONTEXTUEL
       ===================================== */

    document.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );


    /* =====================================
       RACCOURCIS
       ===================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        const key =
          event.key.toLowerCase();


        if (
          event.ctrlKey &&
          (
            key === "p" ||
            key === "s" ||
            key === "u"
          )
        ) {

          event.preventDefault();

        }

      }
    );


    /* =====================================
       FERMETURE DE LA PAGE
       ===================================== */

    window.addEventListener(
      "pagehide",
      function() {


        if (
          !currentSessionId
        ) {

          return;

        }


        const session =
          currentSessionId;


        currentSessionId =
          null;


        const body =
          JSON.stringify({
            session_id:
              session
          });


        try {

          navigator.sendBeacon(
            RELEASE_URL,
            new Blob(
              [body],
              {
                type:
                  "application/json"
              }
            )
          );

        } catch (error) {

          console.error(
            error
          );

        }

      }
    );

  </script>

</body>

</html>
