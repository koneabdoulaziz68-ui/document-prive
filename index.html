<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document privé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d62828;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="icon">📄</div>

    <h1>DOCUMENT PRIVÉ</h1>

    <p>
      Entrez votre code d'accès pour ouvrir le document.
    </p>

    <input
      type="text"
      id="accessCode"
      placeholder="ABC-123456"
      autocomplete="off"
      autocapitalize="characters"
      spellcheck="false"
    >

    <button id="openButton" onclick="openDocument()">
      OUVRIR LE DOCUMENT
    </button>

    <div id="message"></div>

  </div>

  <script>

    const VERIFY_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/verify-access";

    async function openDocument() {

      const input = document.getElementById("accessCode");
      const button = document.getElementById("openButton");
      const message = document.getElementById("message");

      const code = input.value.trim();

      if (!code) {
        message.textContent =
          "Veuillez entrer votre code d'accès.";
        message.className = "error";
        return;
      }

      button.disabled = true;
      button.textContent = "VÉRIFICATION...";
      message.textContent = "";

      try {

        const response = await fetch(VERIFY_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            code: code
          })

        });

        const result = await response.json();

        if (result.success) {

          /*
           * Pour le moment, nous affichons seulement
           * la confirmation.
           *
           * Le lecteur PDF sécurisé sera ajouté
           * dans l'étape suivante.
           */

          message.textContent =
            "Accès autorisé. Session créée.";

          message.className = "success";

          console.log(
            "Session ID :",
            result.session_id
          );

          button.textContent = "ACCÈS AUTORISÉ";

        } else {

          message.textContent =
            result.message || "Accès refusé.";

          message.className = "error";

          button.disabled = false;
          button.textContent = "OUVRIR LE DOCUMENT";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Impossible de contacter le serveur.";

        message.className = "error";

        button.disabled = false;
        button.textContent = "RÉESSAYER";
      }
    }

  </script>

</body>
</html>
