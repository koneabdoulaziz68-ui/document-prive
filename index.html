<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document privé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d62828;
    }

    .document-container {
      display: none;
      min-height: 100vh;
      background: #222;
    }

    .document-header {
      height: 60px;
      background: #111;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .document-title {
      font-size: 15px;
      font-weight: bold;
    }

    .exit-button {
      width: auto;
      padding: 9px 15px;
      background: #c62828;
      font-size: 13px;
    }

    .pdf-area {
      width: 100%;
      min-height: calc(100vh - 60px);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      overflow: auto;
    }

    #pdfFrame {
      width: 100%;
      height: calc(100vh - 100px);
      border: none;
      background: white;
      border-radius: 4px;
    }

    .loading {
      color: white;
      padding: 40px;
      text-align: center;
    }

    @media (max-width: 600px) {
      .pdf-area {
        padding: 5px;
      }

      #pdfFrame {
        height: calc(100vh - 70px);
      }

      .document-title {
        font-size: 12px;
      }
    }

    @media print {
      body {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       PAGE DE CONNEXION
       ========================= -->

  <div class="login-container" id="loginContainer">

    <div class="login-box">

      <div class="icon">📄</div>

      <h1>DOCUMENT PRIVÉ</h1>

      <p class="description">
        Entrez votre code d'accès pour ouvrir le document.
      </p>

      <input
        type="text"
        id="accessCode"
        placeholder="ABC-123456"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >

      <button id="openButton" onclick="openDocument()">
        OUVRIR LE DOCUMENT
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- =========================
       LECTEUR DU DOCUMENT
       ========================= -->

  <div class="document-container" id="documentContainer">

    <div class="document-header">

      <div class="document-title">
        📄 DOCUMENT PRIVÉ
      </div>

      <button
        class="exit-button"
        onclick="exitDocument()"
      >
        QUITTER
      </button>

    </div>

    <div class="pdf-area" id="pdfArea">

      <div class="loading" id="pdfLoading">
        Chargement du document...
      </div>

      <iframe
        id="pdfFrame"
        title="Document privé"
        style="display:none;"
      ></iframe>

    </div>

  </div>


  <script>

    const VERIFY_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/verify-access";

    const RELEASE_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/release-access";

    const DOCUMENT_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/get-document";


    let currentSessionId = null;


    // ==========================================
    // OUVERTURE DU DOCUMENT
    // ==========================================

    async function openDocument() {

      const input =
        document.getElementById("accessCode");

      const button =
        document.getElementById("openButton");

      const message =
        document.getElementById("message");

      const code =
        input.value.trim();

      if (!code) {

        message.textContent =
          "Veuillez entrer votre code d'accès.";

        message.className = "error";

        return;
      }

      button.disabled = true;

      button.textContent =
        "VÉRIFICATION...";

      message.textContent = "";


      try {

        const response =
          await fetch(VERIFY_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              code: code
            })

          });


        const result =
          await response.json();


        if (!result.success) {

          message.textContent =
            result.message || "Accès refusé.";

          message.className =
            "error";

          button.disabled = false;

          button.textContent =
            "OUVRIR LE DOCUMENT";

          return;
        }


        // Enregistrer la session
        currentSessionId =
          result.session_id;


        message.textContent =
          "Accès autorisé. Chargement du document...";

        message.className =
          "success";


        // Charger le document
        await loadDocument();


      } catch (error) {

        console.error(error);

        message.textContent =
          "Impossible de contacter le serveur.";

        message.className =
          "error";

        button.disabled = false;

        button.textContent =
          "RÉESSAYER";
      }

    }


    // ==========================================
    // CHARGEMENT DU PDF
    // ==========================================

    async function loadDocument() {

      const response =
        await fetch(DOCUMENT_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            session_id: currentSessionId
          })

        });


      if (!response.ok) {

        throw new Error(
          "Impossible de récupérer le document."
        );

      }


      const pdfBlob =
        await response.blob();


      const pdfUrl =
        URL.createObjectURL(pdfBlob);


      const frame =
        document.getElementById("pdfFrame");

      const loading =
        document.getElementById("pdfLoading");


      frame.src = pdfUrl;

      loading.style.display =
        "none";

      frame.style.display =
        "block";


      document
        .getElementById("loginContainer")
        .style.display = "none";


      document
        .getElementById("documentContainer")
        .style.display = "block";

    }


    // ==========================================
    // QUITTER LE DOCUMENT
    // ==========================================

    async function exitDocument() {

      if (!currentSessionId) {
        return;
      }


      try {

        await fetch(RELEASE_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            session_id: currentSessionId
          })

        });

      } catch (error) {

        console.error(
          "Erreur de libération :",
          error
        );

      }


      currentSessionId = null;


      const frame =
        document.getElementById("pdfFrame");


      if (frame.src) {

        URL.revokeObjectURL(
          frame.src
        );

        frame.src = "";

      }


      document
        .getElementById("documentContainer")
        .style.display = "none";


      document
        .getElementById("loginContainer")
        .style.display = "flex";


      document
        .getElementById("accessCode")
        .value = "";


      document
        .getElementById("message")
        .textContent = "";


      const button =
        document.getElementById("openButton");

      button.disabled = false;

      button.textContent =
        "OUVRIR LE DOCUMENT";

    }


    // ==========================================
    // PROTECTION COPIER/COLLER
    // ==========================================

    document.addEventListener(
      "copy",
      function(event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "cut",
      function(event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );


    // ==========================================
    // PROTECTION DES RACCOURCIS
    // ==========================================

    document.addEventListener(
      "keydown",
      function(event) {

        // Ctrl + P
        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "p"
        ) {

          event.preventDefault();

        }


        // Ctrl + S
        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "s"
        ) {

          event.preventDefault();

        }


        // Ctrl + U
        if (
          event.ctrlKey &&
          event.key.toLowerCase() === "u"
        ) {

          event.preventDefault();

        }

      }
    );


    // ==========================================
    // LIBÉRATION SI LA PAGE EST FERMÉE
    // ==========================================

    window.addEventListener(
      "pagehide",
      function() {

        if (!currentSessionId) {
          return;
        }


        const data =
          JSON.stringify({
            session_id: currentSessionId
          });


        navigator.sendBeacon(
          RELEASE_URL,
          new Blob(
            [data],
            {
              type: "application/json"
            }
          )
        );

      }
    );

  </script>

</body>
</html>
