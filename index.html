<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document privé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f1f1f1;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* =========================
       CONNEXION
       ========================= */

    #loginContainer {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.08);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d62828;
    }

    /* =========================
       DOCUMENT
       ========================= */

    #documentContainer {
      display: none;
      min-height: 100vh;
    }

    .document-header {
      height: 60px;
      background: #111;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .document-title {
      font-size: 15px;
      font-weight: bold;
    }

    .exit-button {
      width: auto;
      padding: 9px 15px;
      background: #d62828;
      font-size: 13px;
    }

    #pdfViewer {
      width: 100%;
      padding: 15px 5px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .page-container {
      background: white;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
      max-width: 100%;
    }

    .page-container canvas {
      display: block;
      max-width: 100%;
      height: auto;
    }

    .page-number {
      text-align: center;
      background: #111;
      color: white;
      font-size: 11px;
      padding: 5px;
    }

    #loadingDocument {
      color: #444;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 600px) {

      #pdfViewer {
        padding: 5px 2px 30px;
        gap: 8px;
      }

      .document-title {
        font-size: 12px;
      }

      .page-container {
        width: 100%;
      }

    }

    /* Impression */
    @media print {
      body {
        display: none !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       PAGE DE CONNEXION
       ========================= -->

  <div id="loginContainer">

    <div class="login-box">

      <div class="icon">📄</div>

      <h1>DOCUMENT PRIVÉ</h1>

      <p class="description">
        Entrez votre code d'accès pour ouvrir le document.
      </p>

      <input
        id="accessCode"
        type="text"
        placeholder="ABC-123456"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >

      <button
        id="openButton"
        onclick="openDocument()"
      >
        OUVRIR LE DOCUMENT
      </button>

      <div id="message"></div>

    </div>

  </div>


  <!-- =========================
       DOCUMENT
       ========================= -->

  <div id="documentContainer">

    <div class="document-header">

      <div class="document-title">
        📄 DOCUMENT PRIVÉ
      </div>

      <button
        class="exit-button"
        onclick="exitDocument()"
      >
        QUITTER
      </button>

    </div>

    <div id="loadingDocument">
      Chargement du document...
    </div>

    <div id="pdfViewer"></div>

  </div>


  <!-- =========================
       PDF.JS
       ========================= -->

  <script type="module">

    import {
      getDocument,
      GlobalWorkerOptions
    } from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.mjs";


    GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.1.200/build/pdf.worker.mjs";


    /* =========================
       URLS SUPABASE
       ========================= */

    const VERIFY_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/verify-access";

    const RELEASE_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/release-access";

    const DOCUMENT_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/get-document";


    let currentSessionId = null;


    /* =========================
       MESSAGE
       ========================= */

    function showMessage(text, type = "") {

      const message =
        document.getElementById("message");

      message.textContent = text;
      message.className = type;

    }


    /* =========================
       OUVERTURE
       ========================= */

    window.openDocument = async function() {

      const code =
        document
          .getElementById("accessCode")
          .value
          .trim();

      const button =
        document.getElementById("openButton");


      if (!code) {

        showMessage(
          "Veuillez entrer votre code d'accès.",
          "error"
        );

        return;

      }


      button.disabled = true;
      button.textContent = "VÉRIFICATION...";

      showMessage("");


      try {

        /* =========================
           VÉRIFICATION DU CODE
           ========================= */

        const response =
          await fetch(
            VERIFY_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  code: code
                })
            }
          );


        const result =
          await response.json();


        if (!response.ok ||
            !result.success) {

          throw new Error(
            result.message ||
            "Accès refusé."
          );

        }


        currentSessionId =
          result.session_id;


        showMessage(
          "Accès autorisé. Chargement du document...",
          "success"
        );


        /* =========================
           RÉCUPÉRATION DU PDF
           ========================= */

        await loadPdf();


      } catch (error) {

        console.error(error);


        if (currentSessionId) {

          await releaseSession(
            currentSessionId
          );

          currentSessionId = null;

        }


        showMessage(
          error.message ||
          "Une erreur est survenue.",
          "error"
        );


        button.disabled = false;
        button.textContent =
          "RÉESSAYER";

      }

    };


    /* =========================
       RÉCUPÉRER LE PDF
       ========================= */

    async function loadPdf() {

      const response =
        await fetch(
          DOCUMENT_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                session_id:
                  currentSessionId
              })
          }
        );


      if (!response.ok) {

        let message =
          "Impossible de récupérer le document.";


        try {

          const errorData =
            await response.json();

          if (errorData.message) {
            message =
              errorData.message;
          }

        } catch (_) {}


        throw new Error(message);

      }


      const contentType =
        response.headers.get(
          "content-type"
        );


      if (
        !contentType ||
        !contentType.includes(
          "application/pdf"
        )
      ) {

        throw new Error(
          "Le serveur n'a pas renvoyé un PDF."
        );

      }


      const pdfBlob =
        await response.blob();


      const pdfArrayBuffer =
        await pdfBlob.arrayBuffer();


      /* =========================
         OUVRIR AVEC PDF.JS
         ========================= */

      const loadingTask =
        getDocument({
          data:
            new Uint8Array(
              pdfArrayBuffer
            )
        });


      const pdf =
        await loadingTask.promise;


      document
        .getElementById(
          "loginContainer"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "documentContainer"
        )
        .style.display =
          "block";


      document
        .getElementById(
          "loadingDocument"
        )
        .style.display =
          "none";


      const viewer =
        document
          .getElementById(
            "pdfViewer"
          );


      viewer.innerHTML = "";


      /* =========================
         RENDRE LES PAGES
         ========================= */

      for (
        let pageNumber = 1;
        pageNumber <= pdf.numPages;
        pageNumber++
      ) {

        await renderPage(
          pdf,
          pageNumber,
          viewer
        );

      }

    }


    /* =========================
       RENDRE UNE PAGE
       ========================= */

    async function renderPage(
      pdf,
      pageNumber,
      viewer
    ) {

      const page =
        await pdf.getPage(
          pageNumber
        );


      const baseViewport =
        page.getViewport({
          scale: 1
        });


      const availableWidth =
        Math.min(
          window.innerWidth - 10,
          900
        );


      let scale =
        availableWidth /
        baseViewport.width;


      /* Sur petit écran,
         on garde une taille lisible. */

      if (scale < 0.8) {
        scale = 0.8;
      }


      const viewport =
        page.getViewport({
          scale: scale
        });


      const container =
        document.createElement(
          "div"
        );

      container.className =
        "page-container";


      const canvas =
        document.createElement(
          "canvas"
        );


      const context =
        canvas.getContext(
          "2d"
        );


      const outputScale =
        window.devicePixelRatio || 1;


      canvas.width =
        Math.floor(
          viewport.width *
          outputScale
        );


      canvas.height =
        Math.floor(
          viewport.height *
          outputScale
        );


      canvas.style.width =
        Math.floor(
          viewport.width
        ) + "px";


      canvas.style.height =
        Math.floor(
          viewport.height
        ) + "px";


      const pageNumberLabel =
        document.createElement(
          "div"
        );


      pageNumberLabel.className =
        "page-number";


      pageNumberLabel.textContent =
        "Page " +
        pageNumber +
        " / " +
        pdf.numPages;


      container.appendChild(
        canvas
      );

      container.appendChild(
        pageNumberLabel
      );

      viewer.appendChild(
        container
      );


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport,

        transform:
          outputScale !== 1
            ? [
                outputScale,
                0,
                0,
                outputScale,
                0,
                0
              ]
            : null

      }).promise;

    }


    /* =========================
       LIBÉRER SESSION
       ========================= */

    async function releaseSession(
      sessionId
    ) {

      if (!sessionId) {
        return;
      }


      try {

        await fetch(
          RELEASE_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                session_id:
                  sessionId
              })
          }
        );

      } catch (error) {

        console.error(
          "Erreur libération :",
          error
        );

      }

    }


    /* =========================
       QUITTER
       ========================= */

    window.exitDocument =
      async function() {

        const session =
          currentSessionId;


        currentSessionId =
          null;


        await releaseSession(
          session
        );


        document
          .getElementById(
            "pdfViewer"
          )
          .innerHTML = "";


        document
          .getElementById(
            "documentContainer"
          )
          .style.display =
            "none";


        document
          .getElementById(
            "loginContainer"
          )
          .style.display =
            "flex";


        document
          .getElementById(
            "accessCode"
          )
          .value = "";


        const button =
          document
            .getElementById(
              "openButton"
            );


        button.disabled =
          false;


        button.textContent =
          "OUVRIR LE DOCUMENT";


        showMessage("");

      };


    /* =========================
       FERMETURE PAGE
       ========================= */

    window.addEventListener(
      "pagehide",
      function() {

        if (!currentSessionId) {
          return;
        }


        const body =
          JSON.stringify({
            session_id:
              currentSessionId
          });


        navigator.sendBeacon(
          RELEASE_URL,
          new Blob(
            [body],
            {
              type:
                "application/json"
            }
          )
        );


        currentSessionId =
          null;

      }
    );


    /* =========================
       PROTECTIONS INTERFACE
       ========================= */

    document.addEventListener(
      "contextmenu",
      event =>
        event.preventDefault()
    );


    document.addEventListener(
      "copy",
      event =>
        event.preventDefault()
    );


    document.addEventListener(
      "cut",
      event =>
        event.preventDefault()
    );


    document.addEventListener(
      "keydown",
      function(event) {

        const key =
          event.key.toLowerCase();


        if (
          event.ctrlKey &&
          (
            key === "p" ||
            key === "s" ||
            key === "u"
          )
        ) {

          event.preventDefault();

        }

      }
    );

  </script>

</body>
</html>
