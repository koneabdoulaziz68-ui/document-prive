<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Document privé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    /* =========================
       PAGE DE CONNEXION
       ========================= */

    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 25px;
    }

    .description {
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      text-align: center;
      outline: none;
      margin-bottom: 15px;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 15px;
      min-height: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d62828;
    }

    /* =========================
       DOCUMENT
       ========================= */

    .document-container {
      display: none;
      min-height: 100vh;
      background: #222;
    }

    .document-header {
      height: 60px;
      background: #111;
      color: white;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;

      position: sticky;
      top: 0;
      z-index: 10;
    }

    .document-title {
      font-size: 15px;
      font-weight: bold;
    }

    .exit-button {
      width: auto;
      padding: 9px 15px;
      background: #c62828;
      font-size: 13px;
    }

    .pdf-area {
      width: 100%;
      min-height: calc(100vh - 60px);

      display: flex;
      justify-content: center;
      align-items: flex-start;

      padding: 10px;
    }

    #pdfFrame {
      width: 100%;
      height: calc(100vh - 80px);

      border: none;
      background: white;
      border-radius: 4px;
    }

    .loading {
      color: white;
      padding: 40px;
      text-align: center;
    }

    @media (max-width: 600px) {

      .pdf-area {
        padding: 3px;
      }

      #pdfFrame {
        height: calc(100vh - 65px);
      }

      .document-title {
        font-size: 12px;
      }

    }

    /* =========================
       IMPRESSION
       ========================= */

    @media print {

      body {
        display: none !important;
      }

    }

  </style>
</head>

<body>


  <!-- ==================================================
       CONNEXION
       ================================================== -->

  <div
    class="login-container"
    id="loginContainer"
  >

    <div class="login-box">

      <div class="icon">
        📄
      </div>

      <h1>
        DOCUMENT PRIVÉ
      </h1>

      <p class="description">
        Entrez votre code d'accès pour ouvrir le document.
      </p>

      <input
        type="text"
        id="accessCode"
        placeholder="ABC-123456"
        autocomplete="off"
        autocapitalize="characters"
        spellcheck="false"
      >

      <button
        id="openButton"
        onclick="openDocument()"
      >
        OUVRIR LE DOCUMENT
      </button>

      <div
        id="message"
      ></div>

    </div>

  </div>


  <!-- ==================================================
       LECTEUR DU DOCUMENT
       ================================================== -->

  <div
    class="document-container"
    id="documentContainer"
  >

    <div class="document-header">

      <div class="document-title">
        📄 DOCUMENT PRIVÉ
      </div>

      <button
        class="exit-button"
        onclick="exitDocument()"
      >
        QUITTER
      </button>

    </div>


    <div
      class="pdf-area"
      id="pdfArea"
    >

      <div
        class="loading"
        id="pdfLoading"
      >
        Chargement du document...
      </div>

      <iframe
        id="pdfFrame"
        title="Document privé"
        style="display: none;"
      ></iframe>

    </div>

  </div>


  <script>

    /* ==================================================
       URLS DES FONCTIONS SUPABASE
       ================================================== */

    const VERIFY_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/verify-access";

    const RELEASE_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/release-access";

    const DOCUMENT_URL =
      "https://lzefnxasbiutjahnsyse.supabase.co/functions/v1/get-document";


    /* ==================================================
       SESSION ACTUELLE
       ================================================== */

    let currentSessionId = null;

    let pdfObjectUrl = null;


    /* ==================================================
       MESSAGE
       ================================================== */

    function showMessage(
      text,
      type
    ) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        type || "";

    }


    /* ==================================================
       OUVRIR LE DOCUMENT
       ================================================== */

    async function openDocument() {

      const input =
        document.getElementById("accessCode");

      const button =
        document.getElementById("openButton");

      const code =
        input.value.trim();


      if (!code) {

        showMessage(
          "Veuillez entrer votre code d'accès.",
          "error"
        );

        return;

      }


      button.disabled = true;

      button.textContent =
        "VÉRIFICATION...";

      showMessage(
        "",
        ""
      );


      try {

        /* ============================================
           1. VÉRIFICATION DU CODE
           ============================================ */

        const verifyResponse =
          await fetch(
            VERIFY_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  code: code
                })
            }
          );


        let verifyResult;


        try {

          verifyResult =
            await verifyResponse.json();

        } catch (error) {

          throw new Error(
            "Réponse invalide du serveur de vérification."
          );

        }


        if (!verifyResponse.ok ||
            !verifyResult.success) {

          showMessage(
            verifyResult.message ||
            "Accès refusé.",
            "error"
          );

          button.disabled = false;

          button.textContent =
            "OUVRIR LE DOCUMENT";

          return;

        }


        /* ============================================
           2. RÉCUPÉRATION DE LA SESSION
           ============================================ */

        currentSessionId =
          verifyResult.session_id;


        if (!currentSessionId) {

          throw new Error(
            "Le serveur n'a pas fourni de session."
          );

        }


        showMessage(
          "Accès autorisé. Chargement du document...",
          "success"
        );


        /* ============================================
           3. RÉCUPÉRATION DU PDF
           ============================================ */

        await loadDocument();


      } catch (error) {

        console.error(
          "Erreur complète :",
          error
        );


        /*
         * Si une session a été créée mais que
         * le document n'a pas pu être chargé,
         * on essaie de libérer la session.
         */

        if (currentSessionId) {

          await releaseSession(
            currentSessionId
          );

          currentSessionId =
            null;

        }


        showMessage(
          error.message ||
          "Une erreur est survenue.",
          "error"
        );


        button.disabled = false;

        button.textContent =
          "RÉESSAYER";

      }

    }


    /* ==================================================
       CHARGER LE PDF
       ================================================== */

    async function loadDocument() {

      const frame =
        document.getElementById("pdfFrame");

      const loading =
        document.getElementById("pdfLoading");


      let response;


      try {

        response =
          await fetch(
            DOCUMENT_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  session_id:
                    currentSessionId
                })
            }
          );

      } catch (error) {

        throw new Error(
          "Impossible de contacter le serveur du document."
        );

      }


      /* ============================================
         SI LE SERVEUR RENVOIE UNE ERREUR
         ============================================ */

      if (!response.ok) {

        let errorMessage =
          "Impossible de récupérer le document.";


        try {

          const errorData =
            await response.json();


          if (errorData.message) {

            errorMessage =
              errorData.message;

          }

        } catch (error) {

          // Réponse non JSON.
        }


        throw new Error(
          errorMessage
        );

      }


      /* ============================================
         VÉRIFICATION DU TYPE
         ============================================ */

      const contentType =
        response.headers.get(
          "content-type"
        );


      if (
        !contentType ||
        !contentType.includes(
          "application/pdf"
        )
      ) {

        throw new Error(
          "Le serveur n'a pas renvoyé un PDF."
        );

      }


      /* ============================================
         RÉCUPÉRATION DU FICHIER
         ============================================ */

      const pdfBlob =
        await response.blob();


      if (
        !pdfBlob ||
        pdfBlob.size === 0
      ) {

        throw new Error(
          "Le document reçu est vide."
        );

      }


      /* ============================================
         URL TEMPORAIRE
         ============================================ */

      pdfObjectUrl =
        URL.createObjectURL(
          pdfBlob
        );


      /* ============================================
         AFFICHAGE
         ============================================ */

      frame.src =
        pdfObjectUrl;


      loading.style.display =
        "none";


      frame.style.display =
        "block";


      document
        .getElementById(
          "loginContainer"
        )
        .style.display =
          "none";


      document
        .getElementById(
          "documentContainer"
        ).style.display =
          "block";

    }


    /* ==================================================
       LIBÉRER UNE SESSION
       ================================================== */

    async function releaseSession(
      sessionId
    ) {

      if (!sessionId) {
        return false;
      }


      try {

        const response =
          await fetch(
            RELEASE_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  session_id:
                    sessionId
                })
            }
          );


        return response.ok;


      } catch (error) {

        console.error(
          "Erreur libération :",
          error
        );

        return false;

      }

    }


    /* ==================================================
       QUITTER LE DOCUMENT
       ================================================== */

    async function exitDocument() {

      const sessionToRelease =
        currentSessionId;


      currentSessionId =
        null;


      /* ============================================
         LIBÉRATION
         ============================================ */

      await releaseSession(
        sessionToRelease
      );


      /* ============================================
         SUPPRESSION DE L'URL TEMPORAIRE
         ============================================ */

      if (pdfObjectUrl) {

        URL.revokeObjectURL(
          pdfObjectUrl
        );

        pdfObjectUrl =
          null;

      }


      const frame =
        document.getElementById(
          "pdfFrame"
        );


      frame.src = "";


      frame.style.display =
        "none";


      document
        .getElementById(
          "pdfLoading"
        ).style.display =
          "block";


      document
        .getElementById(
          "documentContainer"
        ).style.display =
          "none";


      document
        .getElementById(
          "loginContainer"
        ).style.display =
          "flex";


      document
        .getElementById(
          "accessCode"
        ).value =
          "";


      showMessage(
        "",
        ""
      );


      const button =
        document.getElementById(
          "openButton"
        );


      button.disabled =
        false;


      button.textContent =
        "OUVRIR LE DOCUMENT";

    }


    /* ==================================================
       FERMETURE DE LA PAGE
       ================================================== */

    window.addEventListener(
      "pagehide",
      function() {

        if (!currentSessionId) {
          return;
        }


        const data =
          JSON.stringify({
            session_id:
              currentSessionId
          });


        /*
         * sendBeacon permet d'envoyer la
         * libération pendant la fermeture.
         */

        navigator.sendBeacon(
          RELEASE_URL,
          new Blob(
            [data],
            {
              type:
                "application/json"
            }
          )
        );


        currentSessionId =
          null;

      }
    );


    /* ==================================================
       COPIER / COUPER
       ================================================== */

    document.addEventListener(
      "copy",
      function(event) {

        event.preventDefault();

      }
    );


    document.addEventListener(
      "cut",
      function(event) {

        event.preventDefault();

      }
    );


    /* ==================================================
       MENU CONTEXTUEL
       ================================================== */

    document.addEventListener(
      "contextmenu",
      function(event) {

        event.preventDefault();

      }
    );


    /* ==================================================
       RACCOURCIS
       ================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        const key =
          event.key.toLowerCase();


        /* Ctrl + P */

        if (
          event.ctrlKey &&
          key === "p"
        ) {

          event.preventDefault();

        }


        /* Ctrl + S */

        if (
          event.ctrlKey &&
          key === "s"
        ) {

          event.preventDefault();

        }


        /* Ctrl + U */

        if (
          event.ctrlKey &&
          key === "u"
        ) {

          event.preventDefault();

        }

      }
    );


  </script>

</body>
</html>
